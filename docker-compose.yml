services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbdit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dbdit"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Plus de port exposé publiquement : seul le backend a besoin d'y accéder,
    # via le réseau interne Docker (nom de service "db").

  backend:
    image: moustapha1993/backend-gestion-employe:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/dbdit
    depends_on:
      db:
        condition: service_healthy
    # Plus de port exposé publiquement : seul Nginx y accède en interne.

  frontend:
    image: moustapha1993/frontend-gestion-employe:latest
    restart: unless-stopped
    environment:
      # URL RELATIVE : fonctionne quelle que soit l'adresse finale (IP, domaine...)
      REACT_APP_API_URL: /api/employes
    depends_on:
      - backend
    # Plus de port exposé publiquement : seul Nginx y accède en interne.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"   # Seul point d'entrée exposé sur le serveur
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: